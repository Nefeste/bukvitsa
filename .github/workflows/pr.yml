# Проверки на PR (устав студии, ADR 0019): содержание, типы, линтер, тесты — те же команды, что
# агент гоняет перед push (AGENTS.md). Без prebuild, Gradle и APK: сборка — android.yml, по тегу.
# Проверка обязательна для слияния и нужна автослиянию (automerge.yml), поэтому отвечает на каждом
# PR, и на документах тоже: `paths-ignore` здесь нет (ADR 0019).
name: Проверки PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    # Имя задания — имя обязательной проверки: менять вместе с automerge.yml.
    name: Типы, линтер, тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - name: Содержание и типы
        run: npm run typecheck
      - name: Линтер
        run: npm run lint
      - name: Тесты
        run: bun test tools/test
