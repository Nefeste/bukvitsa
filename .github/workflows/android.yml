# Сборка APK — только по тегу vX.Y.Z (ADR студии 0019): ручного запуска нет, слияние в main сборку
# не запускает. Тег должен совпасть с версией в app.json. Перед сборкой — проверки и сценарий в
# браузере; ключ, подпись и содержимое APK — действия набора студии `gornitsa-kit` (ADR студии
# 0022). Без секретов ключа APK собирается только на проверку и в выпуск не идёт.
name: Android APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Тег и версия
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: app.json
          sparse-checkout-cone-mode: false
      - name: Тег и версия совпадают
        run: |
          V="$(node -p "require('./app.json').expo.version")"
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::Тег $GITHUB_REF_NAME, а в app.json версия $V. Тег — v$V."; exit 1; }

  checks:
    name: Проверки и сценарий в браузере
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: bun test tools/test
      - run: npm run export:web
      - name: Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Сценарий
        run: bun tools/e2e/browser.ts
      # Снимки — только когда сценарий упал, и на неделю: место под артефакты общее на все закрытые
      # репозитории аккаунта.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: screens-${{ github.run_number }}
          path: tools/e2e/out/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Сборка APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      permanent: ${{ steps.key.outputs.permanent }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # Бандл JS берёт содержание из src/content/generated — его собирает скрипт.
      - name: Содержание
        run: bun tools/content/build.ts
      - name: Нативный проект (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Больше памяти Gradle
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> android/gradle.properties
      # Первая сборка тега v0.2.0 (08.11.2026) упала до компиляции: обёртка Gradle не дождалась
      # services.gradle.org за 10 с (networkTimeout=10000 в шаблоне Expo). Ждём 2 минуты и скачиваем
      # дистрибутив заранее, до трёх попыток, — медленная сеть больше не роняет сборку.
      - name: Gradle — дольше ждать сеть, скачать заранее
        working-directory: android
        run: |
          set -euo pipefail
          P=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$P"
          grep -qx 'networkTimeout=120000' "$P" || { echo "::error::в $P нет networkTimeout — шаблон Expo поменялся"; exit 1; }
          for i in 1 2 3; do
            ./gradlew --version -q && exit 0
            echo "::warning::Gradle не скачался (попытка $i), жду $((i * 20)) с"
            sleep $((i * 20))
          done
          echo "::error::Gradle не скачался за три попытки"; exit 1

      - name: Ключ подписи
        id: key
        uses: Nefeste/gornitsa-kit/actions/android-keystore@v1
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          gradle-prefix: BUKVITSA

      - name: Сборка
        working-directory: android
        env:
          NODE_ENV: production
          ORG_GRADLE_PROJECT_BUKVITSA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BUKVITSA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BUKVITSA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 64- и 32-битный ARM: игра лёгкая, пусть запускается и на недорогих телефонах (спецификация, «Бюджет»)
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Подпись
        id: cert
        uses: Nefeste/gornitsa-kit/actions/android-signature@v1
        with:
          file: android/app/build/outputs/apk/release/app-release.apk
          expected: ${{ vars.ANDROID_CERT_SHA256 }}
          permanent: ${{ steps.key.outputs.permanent }}
          keystore-file: ${{ steps.key.outputs.file }}

      # Без сети (ADR студии 0005): INTERNET и NETWORK_STATE запрещены; белый список — файлом;
      # автобэкап выключен (app.json); target API не ниже 36; размер — бюджет спецификации.
      - name: Содержимое
        uses: Nefeste/gornitsa-kit/actions/android-contents@v1
        with:
          file: android/app/build/outputs/apk/release/app-release.apk
          allow-file: .github/apk-permissions.txt
          # Профиль «Буквицы» по решениям владельца 08.11.2026: сеть и AD_ID — реклама Яндекса (bukvitsa#4),
          # поэтому запретный список студии — без AD_ID, как у «Нард»; INTERNET обязан быть (признак, что список
          # прочитался); автобэкап обязан быть включён (#15: в копии только база AsyncStorage, ключа устройства
          # у игры нет). Вырезанное в app.json (фоновая служба, Install Referrer, WAKE_LOCK) — по-прежнему запрещено.
          deny: 'EXTERNAL_STORAGE|SYSTEM_ALERT_WINDOW|LOCATION|CAMERA|RECORD_AUDIO|CONTACTS|READ_PHONE|CALL_LOG|SMS|MANAGE_|QUERY_ALL_PACKAGES|ACCOUNTS'
          forbid: 'FOREGROUND_SERVICE|INSTALL_REFERRER|WAKE_LOCK'
          require: '^android\.permission\.INTERNET$'
          backup: 'on'
          min-target-sdk: '36'
          max-size-mb: '40'

      - name: Собрать
        if: steps.key.outputs.permanent == 'yes'
        env:
          LABEL: ${{ steps.cert.outputs.label }}
          SHA: ${{ steps.cert.outputs.sha256 }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/bukvitsa-${{ github.run_number }}.apk"
          printf '%s\n%s\n' "$LABEL" "$SHA" > dist/signature.txt
      - uses: actions/cache/save@v4
        if: steps.key.outputs.permanent == 'yes'
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    name: Выпуск
    needs: [checks, build]
    if: needs.build.outputs.permanent == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo
          sparse-checkout: |
            app.json
            README.md
          sparse-checkout-cone-mode: false
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dist-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Что нового
        id: ver
        run: |
          V=$(node -p "require('./repo/app.json').expo.version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # раздел «### X.Y.Z …» из README, до следующего заголовка
          awk -v v="$V" '$0 ~ "^### "v"( |$)" { on = 1; next } on && /^##/ { exit } on' repo/README.md > notes.md
          {
            cat notes.md
            echo
            echo "---"
            echo "Подписан $(sed -n 1p dist/signature.txt), SHA-256 сертификата: \`$(sed -n 2p dist/signature.txt)\`."
            echo "Собрано из коммита ${{ github.sha }}, сборка ${{ github.run_number }}."
          } > release.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Буквица ${{ steps.ver.outputs.version }}
          body_path: release.md
          files: dist/*.apk
          prerelease: true
