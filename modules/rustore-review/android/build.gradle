// из nardy: modules/rustore-review/android/build.gradle @ 1d2bdff — своё имя пакета.
// Оценка приложения в RuStore изнутри игры (docs/08-game-design.md, «Оценка в RuStore»).
// Официальная обёртка RuStore для React Native собирается старым плагином Android
// и Java 8, поэтому здесь свой модуль Expo поверх нативного SDK. Репозиторий maven RuStore
// добавляет плагин RuStore Pay из общего набора (@gornitsa/kit) в сборке для RuStore.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'games.gornitsa.bukvitsa'
version = '1.0.0'

android {
  namespace "games.gornitsa.bukvitsa.review"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "ru.rustore.sdk:review:10.5.1"
}
