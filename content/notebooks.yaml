  sections: [Работа — Праздность, Ремесло — Снаряд, Ремесло — Мастеровой, Забота — Опыт]
- key: home
  initial: Д
  title: О доме и семье
  blurb: Пословицы о доме, хозяйстве и родне
  sections: [Двор — Дом — Хозяйство, Гость — Хлебосольство, Пища, Семья — Родня, Опрятность]
- key: word
  initial: С
  title: О слове и молчании
  blurb: Пословицы о языке и речи
  sections: [Язык — Речь, Молва — Слава, Тишина — шум, крик, Прямота — Лукавство]
- key: riddles-nature
  initial: Н
  title: Загадки о природе
  blurb: Небо, вода, лес и поле
- key: riddles-home
  initial: У
  title: Загадки о доме
  blurb: Печь, вещи и утварь
- key: things
  initial: В
  title: Старые слова — вещи
  blurb: Что такое голик, буквица и ушат — по Далю
- key: people
