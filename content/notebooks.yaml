# Тетради: ключ, буквица обложки (`initial` — буква темы), название, строка «что внутри», бесплатная ли. Задачи попадают в
# тетрадь полем notebooks в записи; порядок в тетради — виды по кругу, внутри вида по номеру записи (сборка).
#
# Состав с 0.4 (docs/08-game-design.md, «Тетради»): тетради собираются из отбора редактора content/known.txt —
# пословиц, которые узнаются или понятны без словаря. `sections` — разделы Даля, из которых тетрадь берёт пословицы
# отбора (tools/content/pick.ts); `rest: yes` — и разделы, не названные ни в одной тетради. Первая тетрадь берёт
# самые известные из всех разделов.
- key: first
  initial: П
  title: Первая тетрадь
  blurb: Знакомые пословицы и все виды задач
  free: yes
- key: mind
  initial: У
  title: Ум да разум
  blurb: Об ученье, уме и слове
  sections: [Ученье — Наука, Ум — Глупость, Грамота, Толк — Бестолочь, Забота — Опыт, Язык — Речь, Молва — Слава, Память — Помни, Тайна — Любопытство, Похвала — Похвальба, Сущность — Наружность, Осторожность, Раздумье — Решимость]
- key: luck
  initial: С
  title: Счастье да доля
  blurb: О счастье, терпении и надежде
  sections: [Счастье — Удача, Судьба — Терпение — Надежда, Терпение — Надежда, Радость — Горе, Горе — Утешение, Былое — Будущее, Смелость — Отвага — Трусость, Упорство]
- key: work
  initial: Т
  title: Труд да достаток
  blurb: О работе, мере и деньгах
  sections: [Работа — Праздность, Богатство — Достаток, Бережь — Мотовство, Тороватость — Скупость, Много — Мало, Пора — Мера — Успех, Начало — Конец, Ремесло — Снаряд, Ремесло — Мастеровой, Оплошность — Расторопность, Запас, Торговля, Займы, Причина — Следствие, Причина — Отговорка, Вина — Заслуга, Помощь — Кстати, Земледелие, Умеренность — Жадность]
- key: people
  initial: Л
  title: Люди да нравы
  blurb: О правде, добре, дружбе и родной стороне
  rest: yes
