# Тетради: ключ, буквица обложки (`initial` — буква темы), название, строка «что внутри», бесплатная ли. Задачи попадают в тетрадь
# полем notebooks в записи; порядок — по номеру записи. Состав к 1.0 — гипотеза
# (docs/08-game-design.md, «Тетради»).
#
# `sections` и `words` — для черновиков скрипта tools/content/pick.ts (docs/09-content.md, §8):
# из каких разделов Даля брать пословицы и какие основы слов в них должны быть. Тетради загадок
# и старых слов скрипт не наполняет — их собирает ассистент руками (§8).
- key: first
  initial: П
  title: Первая тетрадь
  blurb: Все виды задач — для знакомства
  free: yes
  sections: [Работа — Праздность, Ученье — Наука, Ум — Глупость, Счастье — Удача, Пора — Мера — Успех]
- key: labor
