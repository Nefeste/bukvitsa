about: "Из раздела «Начало — конец». У Даля в скобках: от сватовства: на стол, столовые, кладка, деньги по уговору, с женихова отца, за отпуск из дому девки, работницы. У Даля рядом — «Все дело в почине»."
text: Денежки на стол, а изба на простор.
