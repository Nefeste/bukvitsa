about: "Из раздела «Прямота — лукавство». У Даля в скобках: сказал кот Евстафий, постригшись и посхимившись, да поймав мышку. У Даля рядом — «Простота — половина спасенья»."
text: Кому скоромно, а нам на здоровье.
