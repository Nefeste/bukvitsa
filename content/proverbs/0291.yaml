proverb: dal.pogoda-stihii.57.1
about: "Из раздела «Погода — стихии». У Даля в скобках: лед. У Даля рядом — «Около села лошадка весела»."
text: Ни в огне не горит, ни в воде не тонет.
answer: тонет
