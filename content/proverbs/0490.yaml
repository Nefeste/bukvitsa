about: "Из раздела «Раздумье — решимость». У Даля в скобках: не хочу. У Даля рядом — «Ни вон, ни в избу; ни со двора, ни во двор»."
text: И вижу, да не вижу; и слышу, да не слышу.
answer: вижу
