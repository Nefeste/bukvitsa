text: Скучен день до вечера, коли делать нечего.
answer: нечего
gap: 6

about: >
  Из раздела «Работа — праздность»: день тянется, когда нет дела. У Даля рядом —
  «Не работа сушит, а забота».
notes: >
  Страница раздела на Викитеке помечена «порядок соответствует оригиналу, не вычитан».
  Сверить со сканом 2-го изд., т. I (раздел начинается на с. 650 по оглавлению).
