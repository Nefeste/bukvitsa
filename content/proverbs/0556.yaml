proverb: dal.pravda-krivda.107.1
about: "Из раздела «Правда — кривда». У Даля в скобках: т. е. не начальствует. У Даля рядом — «И Мамай правды не съел»."
text: Правда не на миру стоит, а по миру ходит.
answer: стоит
