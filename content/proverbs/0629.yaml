about: "Из раздела «Свое — чужое». У Даля в скобках: в; или: ступай в кут, где мухи ткут, т. е. за бабью перегородку, в стряпную. У Даля рядом — «Всяк себе хорош»."
text: Садись на кут, да и все тут.
answer: кут
