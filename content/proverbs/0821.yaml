proverb: dal.tolk-bestoloch.898.1
about: "Из раздела «Толк — бестолочь». У Даля в скобках: т. е. такого мастера, который бы одним на всех угодил. У Даля рядом — «Перекрестись да выспись!»."
text: На вкус, на цвет мастера нет.
answer: цвет
