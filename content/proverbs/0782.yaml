proverb: dal.mnogo-malo.114.1
about: "Из раздела «Много — мало». У Даля в скобках: т. е. съедобная трава. У Даля рядом — «Из многих малых выходит одно большое»."
text: И велика, да метлика; и мала, да трава.
answer: трава
