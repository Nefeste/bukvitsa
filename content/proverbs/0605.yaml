proverb: dal.semya-rodnya.66.1
about: "Из раздела «Семья — родня». У Даля в скобках: а денежки не родня. У Даля рядом — «В своей семье всяк сам большой»."
text: Сват, не сват, а в горох не лезь!
answer: горох
