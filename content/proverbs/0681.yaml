proverb: dal.torgovlya.133.1
about: "Из раздела «Торговля». У Даля в скобках: т. е. неизвестно еще, будет ли барыш. У Даля рядом — «Хороший товар сам себя хвалит»."
text: В паю — в бою, а не в добыче.
answer: добыче
