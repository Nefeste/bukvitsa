proverb: dal.pomosch-kstati.379.1
about: "Из раздела «Помощь — кстати». У Даля в скобках: да не умел сесть, снесть. У Даля рядом — «Клин клином выколачивают»."
text: Была честь, да не умел есть.
answer: честь
