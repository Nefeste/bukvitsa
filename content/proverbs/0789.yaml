proverb: dal.horosho-hudo.122.1
about: "Из раздела «Хорошо — худо». У Даля в скобках: т. е. так делай. У Даля рядом — «Так хорошо, что любо»."
text: Чтобы всем тепло, и нам хорошо.
answer: хорошо
