proverb: dal.mir-ssora-spor.53.3
about: "Из раздела «Мир — ссора — спор». У Даля в скобках: игра слов; т. е. на голословный, бездоказательный спор. У Даля рядом — «Чего вы там не разделили?»."
text: Пошло на да и нет.
answer: пошло
