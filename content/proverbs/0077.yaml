proverb: dal.berezh-motovstvo.96.1
about: "Из раздела «Бережь — мотовство». У Даля в скобках: т. е. ешь так, чтоб на хлеб стало. У Даля рядом — «Развернись на все»."
text: Ешь пироги, а хлеб вперед береги.
answer: береги
