about: "Из раздела «Судьба — терпение — надежда». У Даля в скобках: прибавка: на улицу выйдешь — больше увидишь. У Даля рядом — «Отвяжись, худая жизнь, привяжись хорошая!»."
text: Не только свету, что в окне.
answer: окне
