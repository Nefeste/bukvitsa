about: "Из раздела «Гость — хлебосольство». У Даля в скобках: на званого все паси: званый приема ждет. У Даля рядом — «Куры разодрались — к гостям либо к вестям»."
text: Незваный гость легок, а званый тяжел.
answer: тяжел
