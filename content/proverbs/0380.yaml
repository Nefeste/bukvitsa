proverb: dal.usluga-otkaz.62.1
about: "Из раздела «Услуга — отказ». У Даля в скобках: т. е. не говори ни худо, ни хорошо, когда делаю, — не сбивай, не мешай. У Даля рядом — «Добро такать, а лучше помогать»."
text: Не говори под руку.
answer: руку
gap: 4
