about: "Из раздела «Смех — шутка — веселье». У Даля в скобках: над бобами; или: размокнешь, лопнешь. У Даля рядом — «Посильна беда со смехами, а невмочь беда со слезами»."
text: "Не смейся, горох, над нами: сам будешь под ногами."
