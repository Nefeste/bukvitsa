about: "Из раздела «Поиск — находка». У Даля в скобках: на улицу выйдешь, больше увидишь. У Даля рядом — «Чего не поищешь, того не сыщешь»."
text: "Не только свету, что в окне: на улицу пойдешь, больше найдешь."
