about: "Из раздела «Толк — бестолочь». У Даля в скобках: игра слов; влез и в лес, завяз — засел, и за вяз — дерево вяз. У Даля рядом — «Перекрестись да выспись!»."
text: Я влез, и он в лес, я завяз, и он за вяз.
