word: буквица
meaning: стар. азбука, букварь; ныне же так называют старинные славянские письмена
options: [грамотка, пропись, устав]

about: >
  У Даля «буквица» — старое слово для азбуки и букваря, а ещё — растение, полевой
  шалфей. Отсюда и название игры.
notes: >
  Статья «Буква», т. 1, с. 141, абзац «Буквица ж. стар. азбука, букварь…». Неверные
  варианты взяты как слова той же эпохи; их страницы в словаре (ТСД2/Грамота,
  ТСД2/Прописывать, ТСД2/Уставлять) — сверить и записать сюда.
