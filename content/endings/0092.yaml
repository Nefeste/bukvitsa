about: "Из раздела «Семья — родня». У Даля в скобках: и горя. У Даля рядом — «В своей семье всяк сам большой»."
text: Любовь да совет — так и нуждочки нет.
options:
  - пора сеять коноплю
  - казнить, рубить комара
  - поклонишься и кореляку
