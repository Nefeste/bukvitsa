about: Из раздела «Молодость — старость». У Даля рядом — «Два века не изживешь, две молодости не перейдешь».
text: Хоть кривое, да молодое; а старое — и прямое, да гнилое.
options:
  - овсы хороши будут
  - будут добрые проса
  - придет и слабость
