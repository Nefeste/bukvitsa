about: "Из раздела «Ум — глупость». У Даля в скобках: своего не нажить. У Даля рядом — «Начало премудрости страх божий»."
text: Чужим умом жить — добра не нажить.
options:
  - и зимы не будет
  - проймет слеза
  - и без денег живет
