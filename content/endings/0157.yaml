about: "Из раздела «Свое — чужое». У Даля в скобках: было б нам. У Даля рядом — «Всяк себе хорош»."
text: Что мне до чего — было б жить хорошо.
options:
  - веселье на ум не пойдет
  - не добро найдешь
  - и нажить и прожить
