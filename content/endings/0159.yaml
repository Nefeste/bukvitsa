about: "Из раздела «Счастье — удача». У Даля в скобках: т. е. пробудет. У Даля рядом — «Такой стих нашел»."
text: Много временщик, как девять лет, — а больше нет.
options:
  - ни гвоздя, ни дна
  - урожай на овес
  - не к добру
