about: Из раздела «Ремесло — снаряд». У Даля рядом — «В гору-то семеро тащат, а с горы и один столкнет».
text: Щелока не варить — и рубашки не мыть.
options:
  - ни клепок, ни дна
  - много в запросе
  - только пузыри в гору
