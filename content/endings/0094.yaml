about: "Из раздела «Былое — будущее». У Даля в скобках: не ложиться б спать. У Даля рядом — «Год на год не работник»."
text: Знать бы знать — не ходить бы в рать.
options:
  - урожай на лен и коноплю
  - и дельник дородный лежник
  - то, да еще и подперто
