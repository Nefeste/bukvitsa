about: "Из раздела «Бережь — мотовство». У Даля в скобках: т. е. не по достатку. У Даля рядом — «Развернись на все»."
text: На людей глядя жить — на себя плакаться.
options:
  - и нажить и прожить
  - плюнь да сгасни
  - и правда наружу
