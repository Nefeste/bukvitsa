about: Из раздела «Причина — отговорка». У Даля рядом — «Тут есть причина».
text: "Добро, собьем ведро: обручи под лавку, а клепки в печь — так и не будет течь."
options:
  - коли стыда в глазах нет
  - знать, коров доить пора
  - загон; не игла шьет, а руки
