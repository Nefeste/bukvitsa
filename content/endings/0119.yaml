about: "Из раздела «Двор — дом — хозяйство». У Даля в скобках: задвижной ставень. У Даля рядом — «Держись друга старого, а дома нового!»."
text: По стене ползет — то к свету, то от свету.
options:
  - свой простор, своя и теснота
  - к теплому лету; к урожаю орехов
  - припасай закрому про овес с ячменем
