about: Из раздела «Смелость — отвага — трусость». У Даля рядом — «Смелость города берет».
text: У меня твердо он — то, да еще и подперто.
options:
  - надо и к себе водить
  - не ночевать голубушке дома
  - не еду, а приехал, так еду
