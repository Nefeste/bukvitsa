about: Из раздела «Толк — бестолочь». У Даля рядом — «Перекрестись да выспись!».
text: В латаном да в платаном — худо, а хуже, как платать нечего.
options:
  - брюхо в семь овчин сошьет
  - не беда, да пришла бы вода
  - не видать ему лошадки довеку
