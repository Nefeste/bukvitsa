about: "Из раздела «Прямота — лукавство». У Даля в скобках: т. е. слукавил неудачно. У Даля рядом — «Простота — половина спасенья»."
text: Сам, кажись, и прост — да увяз хвост.
options:
  - себе досадить
  - будет у воза
  - светлая пуговица
