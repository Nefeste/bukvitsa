proverb: dal.molodost-starost.153.1
about: Из раздела «Молодость — старость». У Даля рядом — «Два века не изживешь, две молодости не перейдешь».
text: Старость придет — веселье на ум не пойдет.
options:
  - и на себя не походить
  - и в земле не сгниешь
  - либо сыч, либо сова
